name: Create staging Vehicle Checks review records

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type CREATE STAGING REVIEW RECORDS to create two labelled records in staging only'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  vehicle-check-review:
    name: Create and verify staging Vehicle Checks review records
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      E2E_STAGING_TEST_EMAIL: ${{ secrets.E2E_STAGING_TEST_EMAIL }}
      E2E_STAGING_TEST_PASSWORD: ${{ secrets.E2E_STAGING_TEST_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate confirmation
        shell: bash
        run: |
          test "${{ inputs.confirmation }}" = 'CREATE STAGING REVIEW RECORDS' || {
            echo 'Confirmation must be exactly: CREATE STAGING REVIEW RECORDS' >&2
            exit 1
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked test tooling
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download latest isolated staging app bundle
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=spray-wash-staging-app&per_page=100" --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')"
          if [ -z "$artifact_id" ]; then
            echo 'No current spray-wash-staging-app artifact exists. Run Build staging app first.' >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > staging-app.zip
          mkdir staging-app
          unzip -q staging-app.zip -d staging-app
          test -f staging-app/index.html
          test -f staging-app/config.js
          test -f staging-app/STAGING-README.txt
          ref="$(sed -n 's/^Supabase project ref: //p' staging-app/STAGING-README.txt | head -n 1)"
          test -n "$ref" || { echo 'Staging artifact has no project ref.' >&2; exit 1; }
          test "$ref" != 'twkgfmctuffmkvkmdkct' || { echo 'SAFETY STOP: staging artifact identifies production.' >&2; exit 1; }
          ! grep -F 'twkgfmctuffmkvkmdkct' staging-app/config.js >/dev/null || { echo 'SAFETY STOP: staging artifact config references production.' >&2; exit 1; }
          echo "E2E_STAGING_PROJECT_REF=$ref" >> "$GITHUB_ENV"
      - name: Create and verify labelled staging review records
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install http-server staging-app -p 4174 -c-1 > staging-http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/ >/dev/null
          E2E_STAGING_BASE_URL=http://127.0.0.1:4174 npm run test:staging:vehicle-review
      - name: Publish review-run status
        run: |
          echo '## Staging Vehicle Checks review records created and verified' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '- One labelled **pass** record was created and verified to have **zero** generated tasks.' >> "$GITHUB_STEP_SUMMARY"
          echo '- One labelled **single-issue** record was created and verified to have **exactly one** generated task.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Records are retained in the isolated staging database for browser review. They use the `E2E REVIEW —` prefix.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production was not accessed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: staging-vehicle-check-review-failure-evidence
          path: |
            playwright-report/
            test-results/
            staging-http-server.log
          if-no-files-found: warn
          retention-days: 14

name: Validate JavaScript syntax

on:
  pull_request:
    paths:
      - '*.js'
      - '.github/workflows/validate-javascript.yml'
  push:
    branches:
      - main
    paths:
      - '*.js'
      - '.github/workflows/validate-javascript.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check application JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check operations-v4.js
          node --check backup-v4.js
          node --check service-worker.js

name: Build staging route diagnostics

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD ROUTE DIAGNOSTICS
        required: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "BUILD ROUTE DIAGNOSTICS"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest Home-fixed staging artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api "repos/$REPO/actions/artifacts?name=spray-wash-staging-app-home-fixed&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')
          test -n "$artifact_id"
          gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > staging.zip
          rm -rf staging-build
          mkdir staging-build
          unzip -q staging.zip -d staging-build
          test -f staging-build/app.js
          test -f staging-build/operations-v4.js
          test -f staging-build/config.js
          grep -F 'window.SPRAY_WASH_ENV = "staging"' staging-build/config.js
          grep -F 'window.SW_STAGING_HOME_BUILD = "home-cache-v2-20260812";' staging-build/app.js

      - name: Install route diagnostics
        run: |
          set -euo pipefail
          python3 tools/patch-staging-route-diagnostics.py staging-build/app.js staging-build/operations-v4.js
          grep -F 'STAGING ROUTE DIAGNOSTICS' staging-build/app.js
          grep -F 'operations-v4.js showModuleHome' staging-build/operations-v4.js
          grep -F 'operations-v4.js openHeightModule' staging-build/operations-v4.js
          grep -F 'STAGING ROUTE DIAGNOSTICS final snapshots.' staging-build/operations-v4.js
          grep -F "window.swRouteTrace?.('post-load snapshot '+ms+'ms'" staging-build/operations-v4.js

      - name: Force diagnostic cache key
        run: |
          set -euo pipefail
          if [ -f staging-build/service-worker.js ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('staging-build/service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'spray-wash-operations-staging-home-cache-v2-20260812','spray-wash-operations-staging-route-diagnostics-v1',s)
          p.write_text(s,encoding='utf-8')
          PY
            grep -F 'spray-wash-operations-staging-route-diagnostics-v1' staging-build/service-worker.js
          fi

      - name: Upload diagnostic staging app
        uses: actions/upload-artifact@v4
        with:
          name: spray-wash-staging-route-diagnostics
          path: staging-build/
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo '## Staging route diagnostics build'
            echo
            echo '- Diagnostic only; production not changed.'
            echo '- No routing behavior is intentionally changed.'
            echo '- On-screen trace panel records app.js and operations-v4.js lifecycle/routing calls.'
            echo '- Artifact: `spray-wash-staging-route-diagnostics`.'
          } >> "$GITHUB_STEP_SUMMARY"

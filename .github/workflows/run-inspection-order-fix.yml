name: Run inspection order fix

on:
  push:
    branches:
      - agent/consolidate-staging-validated-operations-fixes
    paths:
      - 'ORDER_FIX_TRIGGER.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_PROJECT_NAME: Spray and Wash Staging
      PRODUCTION_PROJECT_REF: twkgfmctuffmkvkmdkct
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-staging-validated-operations-fixes
          fetch-depth: 0

      - name: Fix source ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('operations-v4.js')
          s=p.read_text(encoding='utf-8')
          old="""    const rows = state.inspections.filter(i => targetType === 'vehicle' ? i.vehicle_id === id : i.washing_equipment_id === id)\n      .sort((a,b) => String(b.inspection_date || '').localeCompare(String(a.inspection_date || '')));"""
          new="""    const rows = state.inspections.filter(i => targetType === 'vehicle' ? i.vehicle_id === id : i.washing_equipment_id === id)\n      .sort((a,b) =>\n        String(b.inspection_date || '').localeCompare(String(a.inspection_date || ''))\n        || String(b.created_at || '').localeCompare(String(a.created_at || ''))\n        || String(b.id || '').localeCompare(String(a.id || ''))\n      );"""
          if old not in s: raise SystemExit('latestInspectionFor anchor missing')
          s=s.replace(old,new,1)
          old="""    const myRecent = state.inspections.filter(i => i.submitted_by === state.user?.id || i.submitted_by_email === state.user?.email).slice(0,5);"""
          new="""    const myRecent = state.inspections\n      .filter(i => i.submitted_by === state.user?.id || i.submitted_by_email === state.user?.email)\n      .sort((a,b) =>\n        String(b.inspection_date || '').localeCompare(String(a.inspection_date || ''))\n        || String(b.created_at || '').localeCompare(String(a.created_at || ''))\n        || String(b.id || '').localeCompare(String(a.id || ''))\n      )\n      .slice(0,5);"""
          if old not in s: raise SystemExit('recent-checks anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check operations-v4.js

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Spray & Wash consolidation bot'
          git config user.email 'sprayandwash@users.noreply.github.com'
          git add operations-v4.js
          git diff --cached --check
          git commit -m 'Order same-day inspection records newest first'
          git push origin HEAD:agent/consolidate-staging-validated-operations-fixes

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve staging and build direct artifact
        shell: bash
        run: |
          set -euo pipefail
          supabase projects list --output json > projects.json
          ref="$(jq -r --arg name "$STAGING_PROJECT_NAME" '.[] | select(.name == $name) | (.id // .ref // empty)' projects.json)"
          test -n "$ref"
          test "$ref" != "$PRODUCTION_PROJECT_REF" || { echo 'SAFETY STOP: staging ref matches production.' >&2; exit 1; }
          supabase projects api-keys --project-ref "$ref" --output json > keys.json
          key="$(jq -r '[.[]? | (.api_key // .key // empty) | select(startswith("sb_publishable_"))] | first // empty' keys.json)"
          if [ -z "$key" ]; then key="$(jq -r '[.[]? | select((.name // .type // "") == "anon") | (.api_key // .key // empty)] | first // empty' keys.json)"; fi
          test -n "$key"
          echo "::add-mask::$key"
          url="https://${ref}.supabase.co"
          rm -rf staging-build
          mkdir staging-build
          rsync -a ./ staging-build/ --exclude '.git/' --exclude '.github/' --exclude 'supabase/' --exclude 'tools/' --exclude 'staging-build/' --exclude '*.zip' --exclude 'ORDER_FIX_TRIGGER.txt'
          cat > staging-build/config.js <<EOF
          window.SUPABASE_URL = "$url";
          window.SUPABASE_ANON_KEY = "$key";
          window.SPRAY_WASH_ENV = "staging";
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('staging-build/index.html'); s=p.read_text(encoding='utf-8')
          b='<body class="stagingEnvironment"><div style="position:sticky;top:0;z-index:99999;background:#b91c1c;color:#fff;text-align:center;padding:9px 12px;font:900 14px system-ui">STAGING — INSPECTION ORDER FIX — TEST DATA ONLY — NOT PRODUCTION</div>'
          if '<body>' not in s: raise SystemExit('body marker missing')
          p.write_text(s.replace('<body>',b,1),encoding='utf-8')
          PY
          cmp operations-v4.js staging-build/operations-v4.js
          node --check staging-build/operations-v4.js
          if grep -Fq "$PRODUCTION_PROJECT_REF" staging-build/config.js; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: spray-wash-staging-inspection-order-fixed
          path: staging-build/
          retention-days: 14

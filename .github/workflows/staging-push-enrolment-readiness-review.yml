name: Review staging push enrolment readiness

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REVIEW STAGING PUSH ENROLMENT to run the read-only readiness check
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  readiness-review:
    name: Verify staging push enrolment readiness only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      E2E_STAGING_ADMIN_EMAIL: ${{ secrets.E2E_STAGING_ADMIN_EMAIL }}
      E2E_STAGING_ADMIN_PASSWORD: ${{ secrets.E2E_STAGING_ADMIN_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate confirmation and staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = 'REVIEW STAGING PUSH ENROLMENT'
          test -n "${E2E_STAGING_ADMIN_EMAIL:-}"
          test -n "${E2E_STAGING_ADMIN_PASSWORD:-}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked test tooling
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download latest isolated staging app bundle
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=spray-wash-staging-app&per_page=100" --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')"
          test -n "$artifact_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > staging-app.zip
          mkdir staging-app
          unzip -q staging-app.zip -d staging-app
          ref="$(sed -n 's/^Supabase project ref: //p' staging-app/STAGING-README.txt | head -n 1)"
          test -n "$ref" && test "$ref" != 'twkgfmctuffmkvkmdkct'
          ! grep -F 'twkgfmctuffmkvkmdkct' staging-app/config.js >/dev/null
          echo "E2E_STAGING_PROJECT_REF=$ref" >> "$GITHUB_ENV"
      - name: Verify push enrolment readiness only
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install http-server staging-app -p 4174 -c-1 > staging-http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          E2E_STAGING_BASE_URL=http://127.0.0.1:4174 npx playwright test --config=playwright.staging.push-enrolment.config.cjs
      - name: Publish readiness result
        if: ${{ success() }}
        run: |
          echo '## Staging push enrolment readiness passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- VAPID public key was available to the authenticated staging app.' >> "$GITHUB_STEP_SUMMARY"
          echo '- No push subscription, notification delivery, email, SMS, scheduler or production access occurred.' >> "$GITHUB_STEP_SUMMARY"

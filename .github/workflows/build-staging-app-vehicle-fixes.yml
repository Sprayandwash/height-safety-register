name: Build staging app - Vehicle Checks fixes

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD STAGING APP to confirm
        required: true

permissions:
  contents: read

concurrency:
  group: build-staging-app-vehicle-fixes
  cancel-in-progress: false

jobs:
  build:
    name: Build staging review repair bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_PROJECT_NAME: Spray and Wash Staging
      PRODUCTION_PROJECT_REF: twkgfmctuffmkvkmdkct

    steps:
      - name: Validate confirmation and token
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "BUILD STAGING APP" || { echo "Confirmation did not match BUILD STAGING APP." >&2; exit 1; }
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "Missing SUPABASE_ACCESS_TOKEN." >&2; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve staging project and publishable key
        id: staging
        shell: bash
        run: |
          set -euo pipefail
          supabase projects list --output json > projects.json
          count="$(jq -r --arg name "$STAGING_PROJECT_NAME" '[.[] | select(.name == $name)] | length' projects.json)"
          test "$count" -eq 1 || { echo "Expected exactly one staging project; found $count." >&2; exit 1; }
          ref="$(jq -r --arg name "$STAGING_PROJECT_NAME" '.[] | select(.name == $name) | (.id // .ref // empty)' projects.json)"
          test -n "$ref" || { echo "Could not resolve staging project ref." >&2; exit 1; }
          test "$ref" != "$PRODUCTION_PROJECT_REF" || { echo "SAFETY STOP: staging ref matches production." >&2; exit 1; }
          url="https://${ref}.supabase.co"
          supabase projects api-keys --project-ref "$ref" --output json > staging-api-keys.json
          key="$(jq -r '[.[]? | (.api_key // .key // empty) | select(startswith("sb_publishable_"))] | first // empty' staging-api-keys.json)"
          if [ -z "$key" ]; then
            key="$(jq -r '[.[]? | select((.name // .type // "") == "anon") | (.api_key // .key // empty)] | first // empty' staging-api-keys.json)"
          fi
          test -n "$key" || { echo "No staging publishable/anon key returned." >&2; exit 1; }
          echo "::add-mask::$key"
          printf '%s' "$key" > staging-publishable-key.txt
          echo "project_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "project_url=$url" >> "$GITHUB_OUTPUT"

      - name: Build repaired staging bundle
        shell: bash
        env:
          STAGING_PROJECT_REF: ${{ steps.staging.outputs.project_ref }}
          STAGING_URL: ${{ steps.staging.outputs.project_url }}
        run: |
          set -euo pipefail
          rm -rf staging-build
          mkdir staging-build
          rsync -a ./ staging-build/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'supabase/' \
            --exclude 'staging-build/' \
            --exclude '*.zip'

          publishable="$(cat staging-publishable-key.txt)"
          cat > staging-build/config.js <<EOF
          // STAGING ONLY. Generated by GitHub Actions. Do not use for production.
          window.SUPABASE_URL = "$STAGING_URL";
          window.SUPABASE_ANON_KEY = "$publishable";
          window.SPRAY_WASH_ENV = "staging";
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('staging-build/app.js')
          s = app.read_text(encoding='utf-8')
          replacements = {
            'function today(){return new Date().toISOString().slice(0,10);}': '''const APP_TIME_ZONE="Pacific/Auckland";\nfunction dateInTimeZone(value=new Date()){const parts=new Intl.DateTimeFormat("en-NZ",{timeZone:APP_TIME_ZONE,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value);const get=t=>parts.find(p=>p.type===t)?.value||"";return `${get("year")}-${get("month")}-${get("day")}`;}\nfunction today(){return dateInTimeZone(new Date());}''',
            'function addMonths(d,m){let x=new Date((d||today())+"T00:00:00");x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10);}': 'function addMonths(d,m){const [y,mo,da]=(d||today()).split("-").map(Number);const x=new Date(Date.UTC(y,mo-1,da));x.setUTCMonth(x.getUTCMonth()+Number(m||0));return x.toISOString().slice(0,10);}',
            'function datePlus(days){let d=new Date(today()+"T00:00:00"); d.setDate(d.getDate()+Number(days)); return d.toISOString().slice(0,10);}': 'function datePlus(days){const [y,m,d]=today().split("-").map(Number);const x=new Date(Date.UTC(y,m-1,d));x.setUTCDate(x.getUTCDate()+Number(days||0));return x.toISOString().slice(0,10);}'
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit('app.js patch anchor missing: '+old[:80])
              s=s.replace(old,new,1)
          app.write_text(s,encoding='utf-8')

          ops = Path('staging-build/operations-v4.js')
          s = ops.read_text(encoding='utf-8')
          replacements = {
            "  function today(){ return new Date().toISOString().slice(0,10); }": "  const APP_TIME_ZONE = 'Pacific/Auckland';\n  function dateInTimeZone(value = new Date()){ const parts = new Intl.DateTimeFormat('en-NZ',{timeZone:APP_TIME_ZONE,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(value); const get=t => parts.find(p=>p.type===t)?.value || ''; return `${get('year')}-${get('month')}-${get('day')}`; }\n  function today(){ return dateInTimeZone(new Date()); }",
            "  function nzDate(value){ if(!value) return '—'; const d = new Date(String(value).includes('T') ? value : value + 'T00:00:00'); return Number.isNaN(d.getTime()) ? esc(value) : d.toLocaleDateString('en-NZ'); }": "  function nzDate(value){ if(!value) return '—'; const raw=String(value); if(/^\\d{4}-\\d{2}-\\d{2}$/.test(raw)){const [y,m,d]=raw.split('-');return `${d}/${m}/${y}`;} const dt=new Date(raw); return Number.isNaN(dt.getTime()) ? esc(value) : dt.toLocaleDateString('en-NZ',{timeZone:APP_TIME_ZONE}); }",
            "  function addDays(dateStr, days){ const d = new Date((dateStr || today()) + 'T00:00:00'); d.setDate(d.getDate() + Number(days || 0)); return d.toISOString().slice(0,10); }": "  function addDays(dateStr, days){ const [y,m,d]=(dateStr||today()).split('-').map(Number); const dt=new Date(Date.UTC(y,m-1,d)); dt.setUTCDate(dt.getUTCDate()+Number(days||0)); return dt.toISOString().slice(0,10); }",
            "    return `<form id=\"opsInspectionForm\" class=\"ops-form\">": "    return `<form id=\"opsInspectionForm\" class=\"ops-form\" autocomplete=\"off\">",
            "      if(!source || !source.problem || !source.item.creates_task_on_problem) return;": "      if(!source || !source.problem) return;",
            "    refreshTopUserSummary();\n    if(state.currentModule === 'home') renderModuleHome();": "    refreshTopUserSummary();\n    setupLogoHomeClick();\n    if(state.currentModule === 'home') renderModuleHome();",
            "      await refreshAuthAndData();\n    });": "      await refreshAuthAndData();\n      if(state.user) showModuleHome();\n    });",
            "    await refreshAuthAndData();\n  }\n\n  async function refreshAuthAndData(){": "    await refreshAuthAndData();\n    if(state.user) showModuleHome();\n  }\n\n  async function refreshAuthAndData(){"
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit('operations-v4.js patch anchor missing: '+old[:100])
              s=s.replace(old,new,1)

          old_name = '''  function inspectorDisplayName(){\n    const name = maintenanceUserName(state.profile || {}, state.user || {});\n    if(name) return name;\n    const emailName = String(state.user?.email || '').split('@')[0];\n    return titleCaseName(emailName) || 'Inspector';\n  }'''
          new_name = '''  function inspectorDisplayName(){\n    const currentId=String(state.user?.id||'');\n    const currentEmail=String(state.user?.email||'').trim().toLowerCase();\n    const candidates=[\n      (state.actualUsers||[]).find(u=>String(u?.id||'')===currentId),\n      state.profile,\n      (state.pendingUsers||[]).find(u=>String(u?.email||'').trim().toLowerCase()===currentEmail),\n      state.user?.user_metadata\n    ].filter(Boolean);\n    for(const record of candidates){\n      const direct=String(record.display_name||record.full_name||record.name||'').trim();\n      if(direct && direct.toLowerCase()!=='info') return titleCaseName(direct);\n      const first=String(record.first_name||record.firstName||'').trim();\n      const last=String(record.last_name||record.lastName||'').trim();\n      const combined=[first,last].filter(Boolean).join(' ').trim();\n      if(combined && combined.toLowerCase()!=='info') return titleCaseName(combined);\n    }\n    const fallback=maintenanceUserName(state.profile||{},state.user||{});\n    if(fallback && String(fallback).trim().toLowerCase()!=='info') return fallback;\n    return 'Inspector';\n  }'''
          if old_name not in s: raise SystemExit('inspectorDisplayName patch anchor missing')
          s=s.replace(old_name,new_name,1)

          bind_anchor="  function bindRenderedEvents(){\n"
          bind_patch="  function bindRenderedEvents(){\n    const freshInspectionForm=byId('opsInspectionForm');\n    if(freshInspectionForm && freshInspectionForm.dataset.resetApplied!=='1'){ freshInspectionForm.reset(); freshInspectionForm.dataset.resetApplied='1'; }\n"
          if bind_anchor not in s: raise SystemExit('bindRenderedEvents patch anchor missing')
          s=s.replace(bind_anchor,bind_patch,1)

          pattern=r"  async function submitInspection\(e\)\{.*?\n  \}\n\n  async function uploadInspectionPhoto"
          replacement='''  async function submitInspection(e){\n    e.preventDefault(); if(!canSubmit()) return alert('Your role cannot submit Operations inspections.');\n    const submit=e.submitter; if(submit?.disabled) return; if(submit) submit.disabled=true;\n    try{\n      const template = state.templates.find(t=>t.id===byId('opsInspectionTemplate').value) || vehicleChecklistTemplate();\n      if(!template || !template.id) return alert('Vehicle Inspection Checklist is not available.');\n      const targetType = template.target_type;\n      const vehicleId = byId('opsInspectionVehicle')?.value || null;\n      const washId = byId('opsInspectionWash')?.value || null;\n      if(['vehicle','combined'].includes(targetType) && !vehicleId) return alert('Select a vehicle before submitting.');\n      const answerRows=[]; const itemPhotos=[]; let hasProblem=false;\n      try{\n        document.querySelectorAll('.ops-question').forEach(q=>{\n          const item=state.checklistItems.find(i=>i.id===q.dataset.itemId); if(!item) return;\n          const input=q.querySelector('.ops-answer-value'); const answer=input?.value||'';\n          if(input?.hasAttribute('required')&&!answer) throw new Error('Please answer every checklist item before submitting.');\n          const notes=q.querySelector('.ops-answer-notes')?.value||''; const problem=itemIsProblem(item,answer);\n          if(problem) hasProblem=true;\n          const photoFiles=Array.from(q.querySelectorAll('.ops-item-photo')).flatMap(el=>Array.from(el.files||[]));\n          if(q.dataset.photoRequired==='true'&&!photoFiles.length) throw new Error('Upload at least one photo of the cleaned vehicle or cab before submitting.');\n          answerRows.push({item,answer,notes,problem}); photoFiles.forEach(file=>itemPhotos.push({item,file}));\n        });\n      }catch(err){ return alert(err.message); }\n      if(!answerRows.length) return alert('No checklist answers were captured. The inspection was not saved.');\n      const insRow={template_id:template.id,target_type:targetType,vehicle_id:vehicleId,washing_equipment_id:washId,submitted_by:state.user.id,submitted_by_email:state.user.email||'',inspector_name:inspectorDisplayName(),inspection_date:byId('opsInspectionDate').value||today(),odometer:byId('opsInspectionOdo').value?Number(byId('opsInspectionOdo').value):null,overall_result:hasProblem?'Problem':'Pass',notes:byId('opsInspectionNotes').value.trim()||null};\n      const created=await state.sb.from('operations_inspections').insert(insRow).select().single();\n      if(created.error) return alert('Inspection was not saved: '+created.error.message);\n      const inspectionId=created.data.id;\n      const answerInserts=answerRows.map(a=>({inspection_id:inspectionId,checklist_item_id:a.item.id,question_text:a.item.question_text,answer_value:a.answer,answer_number:a.item.response_type==='number'&&a.answer!==''?Number(a.answer):null,is_problem:a.problem,severity:a.item.default_severity||'Medium',notes:a.notes||null}));\n      const ans=await state.sb.from('operations_inspection_answers').insert(answerInserts).select();\n      if(ans.error){ await state.sb.from('operations_inspections').delete().eq('id',inspectionId); return alert('Inspection was not completed because its answers failed to save: '+ans.error.message); }\n      if((ans.data||[]).length!==answerInserts.length) return alert('Inspection verification failed: not all checklist answers were returned after save.');\n      const taskRows=[];\n      (ans.data||[]).forEach(answerRecord=>{const source=answerRows.find(a=>a.item.id===answerRecord.checklist_item_id);if(!source||!source.problem)return;taskRows.push({source_type:'Inspection',source_module:'vehicle_checks',source_record_type:'inspection_answer',source_record_id:answerRecord.id,source_inspection_id:inspectionId,source_answer_id:answerRecord.id,target_type:washId?'washing_equipment':'vehicle',target_record_id:washId||vehicleId,target_label:targetName({vehicle_id:vehicleId,washing_equipment_id:washId}),vehicle_id:vehicleId,washing_equipment_id:washId,title:source.item.default_task_title||source.item.question_text,description:`${source.item.question_text}\\nAnswer: ${source.answer}${source.notes?'\\nNotes: '+source.notes:''}`,status:'Open',priority:source.item.default_severity||'Medium',created_by:state.user.id,due_date:today(),assigned_role:'Maintenance manager',automatic_key:`vehicle_check_answer:${answerRecord.id}`});});\n      if(taskRows.length){const tr=await state.sb.from('operations_maintenance_tasks').insert(taskRows).select('id');if(tr.error)return alert('Inspection answers saved, but the required follow-up task could not be created: '+tr.error.message);if((tr.data||[]).length!==taskRows.length)return alert('Inspection task verification failed. Please report this test result.');}\n      for(const p of itemPhotos) await uploadInspectionPhoto(inspectionId,p.file,p.item.id,p.item.question_text);\n      const verify=await state.sb.from('operations_inspections').select('id,overall_result,inspector_name').eq('id',inspectionId).single();\n      if(verify.error||!verify.data?.id) return alert('Inspection save verification failed. Please report this test result.');\n      state.currentView='vehicle-checks'; await loadAll();\n      const fresh=byId('opsInspectionForm'); if(fresh){fresh.reset();byId('opsInspectionDate').value=today();if(byId('opsInspectorName'))byId('opsInspectorName').value=inspectorDisplayName();}\n      alert(`Inspection saved and verified. ${taskRows.length} maintenance task${taskRows.length===1?'':'s'} created.`);\n    }finally{if(submit)submit.disabled=false;}\n  }\n\n  async function uploadInspectionPhoto'''
          s2,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1: raise SystemExit(f'submitInspection replacement count was {n}, expected 1')
          ops.write_text(s2,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('staging-build/index.html'); s=p.read_text(encoding='utf-8')
          marker='<body>'
          banner='''<body class="stagingEnvironment">\n<div id="stagingEnvironmentBanner" style="position:sticky;top:0;z-index:99999;background:#b91c1c;color:#fff;text-align:center;padding:9px 12px;font:900 14px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.04em;box-shadow:0 2px 10px #0003">STAGING — TEST DATA ONLY — NOT PRODUCTION</div>'''
          if marker not in s: raise SystemExit('Could not locate <body>')
          s=s.replace(marker,banner,1).replace('<title>Spray &amp; Wash Operations</title>','<title>STAGING — Spray &amp; Wash Operations</title>',1)
          p.write_text(s,encoding='utf-8')
          PY

          if [ -f staging-build/service-worker.js ]; then
            sed -i "s/spray-wash-operations-v4-0-84/spray-wash-operations-staging-review-fix/g" staging-build/service-worker.js
          fi

          grep -F "$STAGING_URL" staging-build/config.js >/dev/null
          ! grep -F "$PRODUCTION_PROJECT_REF" staging-build/config.js >/dev/null
          grep -F 'STAGING — TEST DATA ONLY — NOT PRODUCTION' staging-build/index.html >/dev/null
          grep -F 'Inspection saved and verified.' staging-build/operations-v4.js >/dev/null
          grep -F 'setupLogoHomeClick();' staging-build/operations-v4.js >/dev/null
          test "$(grep -F "if(state.user) showModuleHome();" staging-build/operations-v4.js | wc -l)" -ge 2
          find staging-build -type f -print0 | sort -z | xargs -0 sha256sum > staging-build/SHA256SUMS.txt

      - name: Upload repaired staging app
        uses: actions/upload-artifact@v4
        with:
          name: spray-wash-staging-app-vehicle-fixes
          path: staging-build/
          retention-days: 30
          if-no-files-found: error

      - name: Write summary
        shell: bash
        run: |
          {
            echo '## Staging review repair build created'
            echo
            echo '- Production configuration was not changed.'
            echo '- Auth-state sign-in and restored existing sessions both route to the main Home/module dashboard.'
            echo '- The header logo is rebound after renders and returns to Home.'
            echo '- Vehicle issue answers generate follow-up tasks.'
            echo '- Inspection and answer rows are verified before success is shown.'
            echo '- Inspector display-name resolution avoids the incorrect `Info` value.'
            echo '- Vehicle checklists reset after successful save.'
            echo '- NZ date handling remains Pacific/Auckland.'
            echo '- Artifact: `spray-wash-staging-app-vehicle-fixes`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary key material
        if: always()
        shell: bash
        run: rm -f projects.json staging-api-keys.json staging-publishable-key.txt

name: Send one staging weekly email (Step 9B)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SEND ONE STAGING WEEKLY EMAIL to send exactly one controlled staging email
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: staging-weekly-email-delivery-step9b
  cancel-in-progress: false

jobs:
  send:
    name: Send one controlled staging weekly email
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      E2E_STAGING_ADMIN_EMAIL: ${{ secrets.E2E_STAGING_ADMIN_EMAIL }}
      E2E_STAGING_ADMIN_PASSWORD: ${{ secrets.E2E_STAGING_ADMIN_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_PROJECT_REF: twkgfmctuffmkvkmdkct

    steps:
      - name: Validate Step 9B scope and confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'SAFETY STOP: run this workflow from main only.' >&2; exit 1; }
          test "$CONFIRMATION" = 'SEND ONE STAGING WEEKLY EMAIL' || { echo 'Confirmation must be exact.' >&2; exit 1; }
          test -n "${E2E_STAGING_ADMIN_EMAIL:-}" || { echo 'Missing E2E_STAGING_ADMIN_EMAIL.' >&2; exit 1; }
          test -n "${E2E_STAGING_ADMIN_PASSWORD:-}" || { echo 'Missing E2E_STAGING_ADMIN_PASSWORD.' >&2; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked test tooling
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download and verify the isolated staging app bundle
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=spray-wash-staging-app&per_page=100" --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')"
          test -n "$artifact_id" || { echo 'No current spray-wash-staging-app artifact exists. Run Build staging app first.' >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > staging-app.zip
          mkdir staging-app
          unzip -q staging-app.zip -d staging-app
          test -f staging-app/index.html
          test -f staging-app/config.js
          test -f staging-app/STAGING-README.txt
          ref="$(sed -n 's/^Supabase project ref: //p' staging-app/STAGING-README.txt | head -n 1)"
          test -n "$ref" || { echo 'Staging artifact has no project ref.' >&2; exit 1; }
          test "$ref" != "$PRODUCTION_PROJECT_REF" || { echo 'SAFETY STOP: staging artifact identifies production.' >&2; exit 1; }
          ! grep -F "$PRODUCTION_PROJECT_REF" staging-app/config.js >/dev/null || { echo 'SAFETY STOP: staging artifact config references production.' >&2; exit 1; }
          echo "E2E_STAGING_PROJECT_REF=$ref" >> "$GITHUB_ENV"
      - name: Send the one approved staging weekly email
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install http-server staging-app -p 4174 -c-1 > staging-http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/ >/dev/null
          E2E_STAGING_BASE_URL=http://127.0.0.1:4174 npx playwright test --config=playwright.staging.weekly-email-delivery.config.cjs
      - name: Create permanent Step 9B delivery record
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          record="docs/testing/history/step-9b/$(date -u +%F)-weekly-email-run-${GITHUB_RUN_ID}.md"
          cat > "$record" <<EOF
          # Step 9B — controlled staging weekly email delivery

          - **Run:** \`${GITHUB_RUN_ID}\`
          - **Date (UTC):** $(date -u +%F)
          - **Tested commit:** \`${GITHUB_SHA}\`
          - **Outcome:** Passed

          ## Scope and safeguards

          - Isolated Staging Supabase project only: \`${E2E_STAGING_PROJECT_REF}\`.
          - Fresh Step 9B approval and the exact controlled confirmation were required.
          - The provider key, sender and recipient remain function secrets and were not written to this record.
          - Production, scheduling, employee mailouts and push delivery were excluded.

          ## Result

          One Admin weekly-email draft was sent to the preconfigured staging test recipient through Resend. The test verified one new notification record and one new email delivery record. The recipient address and provider identifier are intentionally omitted.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$record"
          git commit -m "Record Step 9B staging weekly email delivery ${GITHUB_RUN_ID}"
          git push
      - name: Publish Step 9B result
        if: success()
        shell: bash
        run: |
          {
            echo '## Step 9B staging weekly-email delivery passed'
            echo
            echo '- One controlled Admin weekly email was sent to the preconfigured staging test recipient.'
            echo '- One notification record and one email delivery record were created and verified.'
            echo '- The permanent Step 9B record was committed without secrets, addresses or provider identifiers.'
            echo '- No scheduler, employee mailout, push or production action was involved.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-weekly-email-delivery-step9b-failure-evidence
          path: |
            playwright-report/
            test-results/
            staging-http-server.log
          if-no-files-found: warn
          retention-days: 14

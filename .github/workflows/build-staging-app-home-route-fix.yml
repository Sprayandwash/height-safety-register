name: Build staging app - source Home route fix

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD STAGING HOME FIX to confirm
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: build-staging-home-route-fix
  cancel-in-progress: false

jobs:
  build:
    name: Build source-level Home routing repair
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "BUILD STAGING HOME FIX" || { echo "Confirmation did not match BUILD STAGING HOME FIX." >&2; exit 1; }

      - name: Download latest working Vehicle Checks staging artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/$REPO/actions/artifacts?name=spray-wash-staging-app-vehicle-fixes&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$artifact_id" || { echo "No current spray-wash-staging-app-vehicle-fixes artifact was found." >&2; exit 1; }
          echo "Using working staging artifact ID $artifact_id"
          gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > working-staging.zip
          rm -rf staging-build
          mkdir staging-build
          unzip -q working-staging.zip -d staging-build
          test -f staging-build/app.js || { echo "Working artifact is missing app.js." >&2; exit 1; }
          test -f staging-build/operations-v4.js || { echo "Working artifact is missing operations-v4.js." >&2; exit 1; }
          test -f staging-build/config.js || { echo "Working artifact is missing config.js." >&2; exit 1; }
          grep -F 'window.SPRAY_WASH_ENV = "staging"' staging-build/config.js >/dev/null || { echo "SAFETY STOP: selected artifact is not marked staging." >&2; exit 1; }

      - name: Patch legacy auth owner to hand off to Home
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('staging-build/app.js')
          s=p.read_text(encoding='utf-8')

          helper_anchor='window.addEventListener("DOMContentLoaded",init);\nasync function init(){'
          helper='''function handoffToOperationsHome(){
  if(!currentUser)return;
  if(typeof window.showModuleHome==="function"){
    window.showModuleHome();
    return;
  }
  console.warn("Operations Home handler was not available after authentication.");
}
window.addEventListener("DOMContentLoaded",init);
async function init(){'''
          if helper_anchor not in s:
              raise SystemExit('Could not locate legacy init anchor in app.js')
          s=s.replace(helper_anchor,helper,1)

          init_old='''  const {data:{session}}=await sb.auth.getSession(); currentUser=session?.user||null; updateAuthUI(); if(currentUser){await ensureCurrentProfile(); await loadRoles(); await loadAppSettings(); await loadData(); await refreshAuditLogs();}
}'''
          init_new='''  const {data:{session}}=await sb.auth.getSession(); currentUser=session?.user||null; updateAuthUI(); if(currentUser){await ensureCurrentProfile(); await loadRoles(); await loadAppSettings(); await loadData(); await refreshAuditLogs(); handoffToOperationsHome();}
}'''
          if init_old not in s:
              raise SystemExit('Could not locate restored-session init flow in app.js')
          s=s.replace(init_old,init_new,1)

          signin_old='''async function signIn(){let email=loginEmail.value.trim(),password=loginPassword.value;if(!email||!password)return alert("Enter email and password.");let {error}=await sb.auth.signInWithPassword({email,password});if(error)return alert(error.message);let {data:{session}}=await sb.auth.getSession();currentUser=session?.user||null;updateAuthUI();await ensureCurrentProfile();await loadRoles();await loadAppSettings();await loadData();await refreshAuditLogs();}'''
          signin_new='''async function signIn(){let email=loginEmail.value.trim(),password=loginPassword.value;if(!email||!password)return alert("Enter email and password.");let {error}=await sb.auth.signInWithPassword({email,password});if(error)return alert(error.message);let {data:{session}}=await sb.auth.getSession();currentUser=session?.user||null;updateAuthUI();await ensureCurrentProfile();await loadRoles();await loadAppSettings();await loadData();await refreshAuditLogs();handoffToOperationsHome();}'''
          if signin_old not in s:
              raise SystemExit('Could not locate explicit sign-in flow in app.js')
          s=s.replace(signin_old,signin_new,1)

          p.write_text(s,encoding='utf-8')
          PY

          grep -F 'function handoffToOperationsHome()' staging-build/app.js >/dev/null
          test "$(grep -F 'handoffToOperationsHome();' staging-build/app.js | wc -l)" -eq 2
          grep -F 'function showModuleHome(){' staging-build/operations-v4.js >/dev/null
          grep -F "state.currentModule = 'home';" staging-build/operations-v4.js >/dev/null
          grep -F "byId('moduleHome')?.classList.remove('hidden');" staging-build/operations-v4.js >/dev/null
          grep -F 'Inspection saved and verified.' staging-build/operations-v4.js >/dev/null

          if [ -f staging-build/service-worker.js ]; then
            sed -i 's/spray-wash-operations-staging-review-fix/spray-wash-operations-staging-home-source-fix-v1/g' staging-build/service-worker.js
            sed -i 's/spray-wash-operations-staging-vehicle-fix/spray-wash-operations-staging-home-source-fix-v1/g' staging-build/service-worker.js
          fi

          find staging-build -type f -print0 | sort -z | xargs -0 sha256sum > staging-build/SHA256SUMS.txt

      - name: Upload source-level repaired staging app
        uses: actions/upload-artifact@v4
        with:
          name: spray-wash-staging-app-home-source-fixed
          path: staging-build/
          retention-days: 30
          if-no-files-found: error

      - name: Write summary
        shell: bash
        run: |
          {
            echo '## Source-level staging Home routing repair'
            echo
            echo '- Based on the latest working `spray-wash-staging-app-vehicle-fixes` artifact.'
            echo '- Production files and production Supabase were not modified.'
            echo '- No injected router or MutationObserver is used.'
            echo '- Legacy `app.js`, which owns sign-in/session restoration, now hands off to `showModuleHome()` only after successful profile/role/data loading.'
            echo '- Both restored-session startup and explicit sign-in use the same Home handoff.'
            echo '- Existing Vehicle Checks repair markers were verified before upload.'
            echo '- Artifact: `spray-wash-staging-app-home-source-fixed`.'
          } >> "$GITHUB_STEP_SUMMARY"

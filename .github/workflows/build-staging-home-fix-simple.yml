name: Build staging Home fix

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD HOME FIX
        required: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "BUILD HOME FIX"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest working staging artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api "repos/$REPO/actions/artifacts?name=spray-wash-staging-app-vehicle-fixes&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')
          test -n "$artifact_id"
          gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > staging.zip
          rm -rf staging-build
          mkdir staging-build
          unzip -q staging.zip -d staging-build
          test -f staging-build/app.js
          test -f staging-build/operations-v4.js
          test -f staging-build/config.js
          grep -F 'window.SPRAY_WASH_ENV = "staging"' staging-build/config.js

      - name: Apply source Home handoff
        run: |
          set -euo pipefail
          python3 tools/patch-staging-home.py staging-build/app.js
          printf '\nwindow.SW_STAGING_HOME_BUILD = "home-cache-v2-20260812";\n' >> staging-build/app.js
          grep -F 'function handoffToOperationsHome()' staging-build/app.js
          test "$(grep -F 'handoffToOperationsHome();' staging-build/app.js | wc -l)" -eq 2
          grep -F 'window.SW_STAGING_HOME_BUILD = "home-cache-v2-20260812";' staging-build/app.js
          grep -F 'function showModuleHome(){' staging-build/operations-v4.js
          grep -F 'Inspection saved and verified.' staging-build/operations-v4.js

      - name: Force fresh staging service worker cache
        run: |
          set -euo pipefail
          if [ -f staging-build/service-worker.js ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('staging-build/service-worker.js')
          s = p.read_text(encoding='utf-8')
          cache_key = 'spray-wash-operations-staging-home-cache-v2-20260812'

          s, count = re.subn(r'spray-wash-operations-[A-Za-z0-9._-]+', cache_key, s)
          if count == 0:
              s = "const SW_STAGING_FORCED_CACHE = '" + cache_key + "';\n" + s

          cleanup = f'''\n\n// STAGING HOME FIX: force this build to take control and remove older app caches.\nself.addEventListener('install', event => {{\n  self.skipWaiting();\n}});\nself.addEventListener('activate', event => {{\n  event.waitUntil(\n    caches.keys()\n      .then(keys => Promise.all(keys.filter(key => key !== '{cache_key}').map(key => caches.delete(key))))\n      .then(() => self.clients.claim())\n  );\n}});\n'''
          s += cleanup
          p.write_text(s, encoding='utf-8')
          PY
            grep -F 'spray-wash-operations-staging-home-cache-v2-20260812' staging-build/service-worker.js
            grep -F 'STAGING HOME FIX: force this build to take control' staging-build/service-worker.js
            grep -F 'self.skipWaiting();' staging-build/service-worker.js
            grep -F 'self.clients.claim()' staging-build/service-worker.js
          fi

      - name: Verify repaired staging bundle
        run: |
          set -euo pipefail
          grep -F 'window.SW_STAGING_HOME_BUILD = "home-cache-v2-20260812";' staging-build/app.js
          grep -F 'function handoffToOperationsHome()' staging-build/app.js
          test "$(grep -F 'handoffToOperationsHome();' staging-build/app.js | wc -l)" -eq 2
          grep -F 'Inspection saved and verified.' staging-build/operations-v4.js
          find staging-build -type f -print0 | sort -z | xargs -0 sha256sum > staging-build/SHA256SUMS.txt

      - name: Upload repaired staging app
        uses: actions/upload-artifact@v4
        with:
          name: spray-wash-staging-app-home-fixed
          path: staging-build/
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo '## Staging Home/cache repair build'
            echo
            echo '- Production was not changed.'
            echo '- Home handoff is present in app.js for restored sessions and explicit sign-in.'
            echo '- app.js marker: `home-cache-v2-20260812`.'
            echo '- Service worker uses a new staging-only cache key.'
            echo '- Service worker calls skipWaiting(), claims clients, and removes older caches on activation.'
            echo '- Artifact: `spray-wash-staging-app-home-fixed`.'
          } >> "$GITHUB_STEP_SUMMARY"

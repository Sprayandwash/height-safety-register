name: Build consolidated branch staging gate

on:
  push:
    branches:
      - agent/consolidate-staging-validated-operations-fixes
    paths:
      - '.github/workflows/build-consolidated-branch-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolidated-branch-staging-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_PROJECT_NAME: Spray and Wash Staging
      PRODUCTION_PROJECT_REF: twkgfmctuffmkvkmdkct

    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidate-staging-validated-operations-fixes
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate consolidated source before packaging
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check operations-v4.js
          node --check backup-v4.js
          node --check service-worker.js
          grep -F "const currentProfile=(state.actualUsers||[]).find(u=>String(userIdOfProfile(u)||'')===currentId) || state.profile || null;" operations-v4.js
          grep -F 'Inspection saved and verified.' operations-v4.js
          grep -F 'id="opsMaintenanceReportPrint"' operations-v4.js
          grep -F 'id="opsMaintenanceReportCsv"' operations-v4.js
          grep -F 'showModuleHome' operations-v4.js
          grep -F "btrim(p_further_maintenance_required)" supabase/migrations/20260816_consolidate_validated_maintenance.sql
          grep -F "'Other maintenance'" supabase/migrations/20260816_consolidate_validated_maintenance.sql
          if grep -Fq 'UPDATE public.operations_maintenance_tasks AS task' supabase/migrations/20260816_consolidate_validated_maintenance.sql; then
            echo 'SAFETY STOP: permanent migration contains staging-only historical cleanup.' >&2
            exit 1
          fi

      - name: Resolve staging project and keys
        id: staging
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN.' >&2; exit 1; }
          supabase projects list --output json > projects.json
          count="$(jq -r --arg name "$STAGING_PROJECT_NAME" '[.[] | select(.name == $name)] | length' projects.json)"
          test "$count" -eq 1 || { echo "Expected one staging project named '$STAGING_PROJECT_NAME'; found $count." >&2; exit 1; }
          ref="$(jq -r --arg name "$STAGING_PROJECT_NAME" '.[] | select(.name == $name) | (.id // .ref // empty)' projects.json)"
          test -n "$ref"
          test "$ref" != "$PRODUCTION_PROJECT_REF" || { echo 'SAFETY STOP: staging ref matches production.' >&2; exit 1; }
          url="https://${ref}.supabase.co"
          supabase projects api-keys --project-ref "$ref" --output json > keys.json
          publishable="$(jq -r '[.[]? | (.api_key // .key // empty) | select(startswith("sb_publishable_"))] | first // empty' keys.json)"
          if [ -z "$publishable" ]; then
            publishable="$(jq -r '[.[]? | select((.name // .type // "") == "anon") | (.api_key // .key // empty)] | first // empty' keys.json)"
          fi
          secret="$(jq -r '[.[]? | select(((.name // .type // "") == "service_role") or ((.api_key // .key // "") | startswith("sb_secret_"))) | (.api_key // .key // empty)] | first // empty' keys.json)"
          test -n "$publishable" || { echo 'No staging publishable/anon key returned.' >&2; exit 1; }
          test -n "$secret" || { echo 'No staging service/secret key returned for read-only regression.' >&2; exit 1; }
          echo "::add-mask::$publishable"
          echo "::add-mask::$secret"
          printf '%s' "$publishable" > publishable-key.txt
          printf '%s' "$secret" > service-key.txt
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Resolved isolated staging project: $STAGING_PROJECT_NAME ($ref)"

      - name: Build staging bundle directly from branch source
        shell: bash
        env:
          STAGING_REF: ${{ steps.staging.outputs.ref }}
          STAGING_URL: ${{ steps.staging.outputs.url }}
        run: |
          set -euo pipefail
          rm -rf staging-build
          mkdir staging-build
          rsync -a ./ staging-build/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'supabase/' \
            --exclude 'tools/' \
            --exclude 'staging-build/' \
            --exclude '*.zip'

          publishable="$(cat publishable-key.txt)"
          cat > staging-build/config.js <<EOF
          // STAGING ONLY. Generated by GitHub Actions. Do not use for production.
          window.SUPABASE_URL = "$STAGING_URL";
          window.SUPABASE_ANON_KEY = "$publishable";
          window.SPRAY_WASH_ENV = "staging";
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('staging-build/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<body>'
          banner='''<body class="stagingEnvironment">\n<div id="stagingEnvironmentBanner" style="position:sticky;top:0;z-index:99999;background:#b91c1c;color:#fff;text-align:center;padding:9px 12px;font:900 14px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.04em;box-shadow:0 2px 10px #0003">STAGING — DIRECT BRANCH BUILD — TEST DATA ONLY — NOT PRODUCTION</div>'''
          if marker not in s:
              raise SystemExit('Could not locate <body> in index.html')
          p.write_text(s.replace(marker,banner,1),encoding='utf-8')
          PY

          if [ -f staging-build/service-worker.js ]; then
            python3 - <<'PY'
          from pathlib import Path
          p=Path('staging-build/service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('operations-v4','operations-staging-direct-v4')
          s=s.replace('height-safety-register','height-safety-register-staging-direct')
          p.write_text(s,encoding='utf-8')
          PY
          fi

          # Critical application files must be byte-for-byte source, with no patch-on-build helpers.
          cmp app.js staging-build/app.js
          cmp operations-v4.js staging-build/operations-v4.js
          cmp backup-v4.js staging-build/backup-v4.js
          sha256sum app.js operations-v4.js backup-v4.js > source-critical-sha256.txt
          sha256sum staging-build/app.js staging-build/operations-v4.js staging-build/backup-v4.js > bundle-critical-sha256.txt

          grep -F "$STAGING_URL" staging-build/config.js >/dev/null
          if grep -Fq "$PRODUCTION_PROJECT_REF" staging-build/config.js; then
            echo 'SAFETY STOP: generated staging config references production.' >&2
            exit 1
          fi
          grep -F 'STAGING — DIRECT BRANCH BUILD — TEST DATA ONLY — NOT PRODUCTION' staging-build/index.html >/dev/null

          cat > staging-build/STAGING-README.txt <<EOF
          Spray & Wash Operations — DIRECT CONSOLIDATION BRANCH STAGING BUILD

          Source branch: agent/consolidate-staging-validated-operations-fixes
          Source commit: $GITHUB_SHA
          Staging Supabase ref: $STAGING_REF
          Built UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          app.js, operations-v4.js and backup-v4.js were copied byte-for-byte from the branch.
          No staging behavior patch helper was run.
          Only environment packaging was changed: staging config/banner and staging service-worker cache namespace.
          Production was not targeted.
          EOF
          find staging-build -type f -print0 | sort -z | xargs -0 sha256sum > staging-build/SHA256SUMS.txt

      - name: Run read-only compact staging DB regression
        shell: bash
        env:
          REF: ${{ steps.staging.outputs.ref }}
        run: |
          set -euo pipefail
          KEY="$(cat service-key.txt)"
          BASE="https://${REF}.supabase.co/rest/v1"
          H1="apikey: ${KEY}"
          H2="Authorization: Bearer ${KEY}"

          verify_case() {
            label="$1"
            note="$2"
            expected_result="$3"
            expected_problems="$4"
            expected_tasks="$5"
            expected_answers="$6"
            expected_inspector="$7"

            curl -fsS -G "$BASE/operations_inspections" -H "$H1" -H "$H2" \
              --data-urlencode 'select=id,inspection_date,overall_result,inspector_name,vehicle_id,submitted_by_email,notes,created_at' \
              --data-urlencode "notes=eq.${note}" --data-urlencode 'order=created_at.desc' --data-urlencode 'limit=1' > "${label}-inspection.json"
            test "$(jq 'length' "${label}-inspection.json")" -eq 1 || { echo "${label}: expected one inspection." >&2; cat "${label}-inspection.json"; exit 1; }
            id="$(jq -r '.[0].id' "${label}-inspection.json")"
            result="$(jq -r '.[0].overall_result' "${label}-inspection.json")"
            inspector="$(jq -r '.[0].inspector_name' "${label}-inspection.json")"
            test "$result" = "$expected_result" || { echo "${label}: expected result $expected_result, found $result." >&2; exit 1; }
            if [ -n "$expected_inspector" ]; then
              test "$inspector" = "$expected_inspector" || { echo "${label}: expected inspector $expected_inspector, found $inspector." >&2; exit 1; }
            fi

            curl -fsS -G "$BASE/operations_inspection_answers" -H "$H1" -H "$H2" \
              --data-urlencode 'select=id,inspection_id,checklist_item_id,question_text,answer_value,is_problem,severity,notes,created_at' \
              --data-urlencode "inspection_id=eq.${id}" --data-urlencode 'order=created_at.asc' > "${label}-answers.json"
            curl -fsS -G "$BASE/operations_maintenance_tasks" -H "$H1" -H "$H2" \
              --data-urlencode 'select=id,status,title,source_module,source_record_type,source_inspection_id,source_answer_id,vehicle_id,created_at' \
              --data-urlencode "source_inspection_id=eq.${id}" --data-urlencode 'order=created_at.asc' > "${label}-tasks.json"

            answers="$(jq 'length' "${label}-answers.json")"
            problems="$(jq '[.[] | select(.is_problem == true)] | length' "${label}-answers.json")"
            tasks="$(jq 'length' "${label}-tasks.json")"
            if [ "$expected_answers" = 'positive' ]; then
              test "$answers" -gt 0 || { echo "${label}: expected answer rows." >&2; exit 1; }
            else
              test "$answers" -eq "$expected_answers" || { echo "${label}: expected $expected_answers answers, found $answers." >&2; exit 1; }
            fi
            test "$problems" -eq "$expected_problems" || { echo "${label}: expected $expected_problems problem answers, found $problems." >&2; exit 1; }
            test "$tasks" -eq "$expected_tasks" || { echo "${label}: expected $expected_tasks linked tasks, found $tasks." >&2; exit 1; }
            echo "$label|$id|$result|$inspector|$answers|$problems|$tasks" >> regression-summary.txt
          }

          : > regression-summary.txt
          verify_case pass 'normal Vehicle Check submission under Samwise Gamgee' Pass 0 0 positive 'Samwise Gamgee'
          verify_case issue 'STAGING TEST - VEHICLE ISSUE' Problem 1 1 68 ''

          issue_task_source="$(jq -r '.[0].source_module // empty' issue-tasks.json)"
          test "$issue_task_source" = 'vehicle_checks' || { echo "Issue task source_module expected vehicle_checks, found $issue_task_source." >&2; exit 1; }

      - name: Upload direct staging build
        uses: actions/upload-artifact@v4
        with:
          name: spray-wash-staging-direct-consolidated-branch
          path: staging-build/
          retention-days: 14
          if-no-files-found: error

      - name: Upload regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-branch-staging-regression-evidence
          path: |
            source-critical-sha256.txt
            bundle-critical-sha256.txt
            regression-summary.txt
            pass-inspection.json
            pass-answers.json
            pass-tasks.json
            issue-inspection.json
            issue-answers.json
            issue-tasks.json
          retention-days: 14
          if-no-files-found: error

      - name: Write gate summary
        shell: bash
        env:
          STAGING_REF: ${{ steps.staging.outputs.ref }}
        run: |
          set -euo pipefail
          pass_line="$(grep '^pass|' regression-summary.txt)"
          issue_line="$(grep '^issue|' regression-summary.txt)"
          {
            echo '## Consolidated branch staging gate'
            echo
            echo '**Result: PASS**'
            echo
            echo "- Branch source commit: \`$GITHUB_SHA\`"
            echo "- Staging Supabase ref: \`$STAGING_REF\`"
            echo '- `app.js`, `operations-v4.js`, and `backup-v4.js` are byte-for-byte copies of branch source.'
            echo '- No patch-on-build behavior helper was executed.'
            echo '- JavaScript syntax validation passed.'
            echo '- Canonical inspector, Vehicle save verification, Maintenance report, Home-route and migration markers passed.'
            echo "- Pass regression: \`$pass_line\`"
            echo "- Issue regression: \`$issue_line\`"
            echo '- Production was not targeted and the database regression was read-only.'
            echo '- Staging artifact: `spray-wash-staging-direct-consolidated-branch`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup key material
        if: always()
        shell: bash
        run: rm -f projects.json keys.json publishable-key.txt service-key.txt

name: Build staging app

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD STAGING APP to confirm
        required: true

permissions:
  contents: read

concurrency:
  group: build-staging-app
  cancel-in-progress: false

jobs:
  build:
    name: Build staging-only app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_PROJECT_NAME: Spray and Wash Staging
      PRODUCTION_PROJECT_REF: twkgfmctuffmkvkmdkct

    steps:
      - name: Validate confirmation and token
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "BUILD STAGING APP" ]; then
            echo "Confirmation did not match BUILD STAGING APP." >&2
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing repository secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Discover staging project
        id: staging
        shell: bash
        run: |
          set -euo pipefail
          supabase projects list --output json > projects.json
          count="$(jq -r --arg name "$STAGING_PROJECT_NAME" '[.[] | select(.name == $name)] | length' projects.json)"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one Supabase project named '$STAGING_PROJECT_NAME'; found $count." >&2
            jq -r '.[] | "- \(.name): \(.id // .ref // "unknown")"' projects.json >&2
            exit 1
          fi
          ref="$(jq -r --arg name "$STAGING_PROJECT_NAME" '.[] | select(.name == $name) | (.id // .ref // empty)' projects.json)"
          if [ -z "$ref" ]; then
            echo "Could not resolve staging project ref." >&2
            exit 1
          fi
          if [ "$ref" = "$PRODUCTION_PROJECT_REF" ]; then
            echo "SAFETY STOP: resolved staging ref matches production." >&2
            exit 1
          fi
          url="https://${ref}.supabase.co"
          echo "project_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "project_url=$url" >> "$GITHUB_OUTPUT"
          echo "Resolved staging project: $STAGING_PROJECT_NAME ($ref)"

      - name: Resolve staging publishable key
        shell: bash
        env:
          STAGING_PROJECT_REF: ${{ steps.staging.outputs.project_ref }}
        run: |
          set -euo pipefail
          supabase projects api-keys --project-ref "$STAGING_PROJECT_REF" --output json > staging-api-keys.json
          publishable="$(jq -r '[.[]? | (.api_key // .key // empty) | select(startswith("sb_publishable_"))] | first // empty' staging-api-keys.json)"
          if [ -z "$publishable" ]; then
            publishable="$(jq -r '[.[]? | select((.name // .type // "") == "anon") | (.api_key // .key // empty)] | first // empty' staging-api-keys.json)"
          fi
          if [ -z "$publishable" ]; then
            echo "No staging publishable/anon key was returned." >&2
            exit 1
          fi
          echo "::add-mask::$publishable"
          printf '%s' "$publishable" > staging-publishable-key.txt

      - name: Create isolated staging bundle
        shell: bash
        env:
          STAGING_PROJECT_REF: ${{ steps.staging.outputs.project_ref }}
          STAGING_URL: ${{ steps.staging.outputs.project_url }}
        run: |
          set -euo pipefail
          rm -rf staging-build
          mkdir staging-build
          rsync -a ./ staging-build/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'supabase/' \
            --exclude 'staging-build/' \
            --exclude '*.zip'

          publishable="$(cat staging-publishable-key.txt)"
          cat > staging-build/config.js <<EOF
          // STAGING ONLY. Generated by GitHub Actions. Do not use for production.
          window.SUPABASE_URL = "$STAGING_URL";
          window.SUPABASE_ANON_KEY = "$publishable";
          window.SPRAY_WASH_ENV = "staging";
          EOF

          python3 - <<'PY'
          from pathlib import Path

          # The production source currently uses UTC-based toISOString() for date-only
          # calculations. For staging functional testing, replace those exact helpers
          # with Pacific/Auckland calendar-date helpers. Timestamps such as created_at
          # remain UTC in Supabase; only date-only logic and user-facing generated times
          # are localized.
          app = Path('staging-build/app.js')
          s = app.read_text(encoding='utf-8')
          replacements = {
            'function today(){return new Date().toISOString().slice(0,10);}': '''const APP_TIME_ZONE="Pacific/Auckland";\nfunction dateInTimeZone(value=new Date()){const parts=new Intl.DateTimeFormat("en-NZ",{timeZone:APP_TIME_ZONE,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value);const get=t=>parts.find(p=>p.type===t)?.value||"";return `${get("year")}-${get("month")}-${get("day")}`;}\nfunction today(){return dateInTimeZone(new Date());}''',
            'function addMonths(d,m){let x=new Date((d||today())+"T00:00:00");x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10);}': 'function addMonths(d,m){const [y,mo,da]=(d||today()).split("-").map(Number);const x=new Date(Date.UTC(y,mo-1,da));x.setUTCMonth(x.getUTCMonth()+Number(m||0));return x.toISOString().slice(0,10);}',
            '  const d=new Date(iso+"T00:00:00");\n  if(Number.isNaN(d.getTime()))return "";\n  d.setFullYear(d.getFullYear()+Number(years));\n  return d.toISOString().slice(0,10);': '  const [y,m,d]=String(iso).split("-").map(Number);\n  const dt=new Date(Date.UTC(y,m-1,d));\n  if(Number.isNaN(dt.getTime()))return "";\n  dt.setUTCFullYear(dt.getUTCFullYear()+Number(years));\n  return dt.toISOString().slice(0,10);',
            'function certNumber(serial){const clean=String(serial||"ITEM").replace(/[^a-zA-Z0-9]+/g,"").slice(0,12)||"ITEM";const d=new Date();const stamp=d.toISOString().slice(0,10).replaceAll("-","");const suffix=String(Date.now()).slice(-6);return `SW-HSE-${stamp}-${clean}-${suffix}`;}': 'function certNumber(serial){const clean=String(serial||"ITEM").replace(/[^a-zA-Z0-9]+/g,"").slice(0,12)||"ITEM";const stamp=today().replaceAll("-","");const suffix=String(Date.now()).slice(-6);return `SW-HSE-${stamp}-${clean}-${suffix}`;}',
            '  const generated=new Date().toLocaleString();': '  const generated=new Date().toLocaleString("en-NZ",{timeZone:APP_TIME_ZONE,dateStyle:"short",timeStyle:"medium"});',
            'function datePlus(days){let d=new Date(today()+"T00:00:00"); d.setDate(d.getDate()+Number(days)); return d.toISOString().slice(0,10);}': 'function datePlus(days){const [y,m,d]=today().split("-").map(Number);const x=new Date(Date.UTC(y,m-1,d));x.setUTCDate(x.getUTCDate()+Number(days||0));return x.toISOString().slice(0,10);}'
          }
          for old,new in replacements.items():
              if old in s:
                  s = s.replace(old,new,1)
              elif new not in s:
                  raise SystemExit(f'app.js NZ-time patch anchor not found: {old[:80]}')
          app.write_text(s, encoding='utf-8')

          ops = Path('staging-build/operations-v4.js')
          s = ops.read_text(encoding='utf-8')
          replacements = {
            "  function today(){ return new Date().toISOString().slice(0,10); }": "  const APP_TIME_ZONE = 'Pacific/Auckland';\n  function dateInTimeZone(value = new Date()){ const parts = new Intl.DateTimeFormat('en-NZ',{timeZone:APP_TIME_ZONE,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(value); const get=t => parts.find(p=>p.type===t)?.value || ''; return `${get('year')}-${get('month')}-${get('day')}`; }\n  function today(){ return dateInTimeZone(new Date()); }",
            "  function nzDate(value){ if(!value) return '—'; const d = new Date(String(value).includes('T') ? value : value + 'T00:00:00'); return Number.isNaN(d.getTime()) ? esc(value) : d.toLocaleDateString('en-NZ'); }": "  function nzDate(value){ if(!value) return '—'; const raw=String(value); if(/^\\d{4}-\\d{2}-\\d{2}$/.test(raw)){const [y,m,d]=raw.split('-');return `${d}/${m}/${y}`;} const dt=new Date(raw); return Number.isNaN(dt.getTime()) ? esc(value) : dt.toLocaleDateString('en-NZ',{timeZone:APP_TIME_ZONE}); }",
            "  function addDays(dateStr, days){ const d = new Date((dateStr || today()) + 'T00:00:00'); d.setDate(d.getDate() + Number(days || 0)); return d.toISOString().slice(0,10); }": "  function addDays(dateStr, days){ const [y,m,d]=(dateStr||today()).split('-').map(Number); const dt=new Date(Date.UTC(y,m-1,d)); dt.setUTCDate(dt.getUTCDate()+Number(days||0)); return dt.toISOString().slice(0,10); }"
          }
          for old,new in replacements.items():
              if old in s:
                  s = s.replace(old,new,1)
              elif new not in s:
                  raise SystemExit(f'operations-v4.js NZ-time patch anchor not found: {old[:80]}')
          ops.write_text(s, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('staging-build/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<body>'
          banner = '''<body class="stagingEnvironment">
          <div id="stagingEnvironmentBanner" style="position:sticky;top:0;z-index:99999;background:#b91c1c;color:#fff;text-align:center;padding:9px 12px;font:900 14px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.04em;box-shadow:0 2px 10px #0003">STAGING — TEST DATA ONLY — NOT PRODUCTION</div>'''
          if marker not in s:
              raise SystemExit('Could not locate <body> in index.html')
          s = s.replace(marker, banner, 1)
          s = s.replace('<title>Spray &amp; Wash Operations</title>', '<title>STAGING — Spray &amp; Wash Operations</title>', 1)
          p.write_text(s, encoding='utf-8')
          PY

          if [ -f staging-build/manifest.webmanifest ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('staging-build/manifest.webmanifest')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['name']='Spray & Wash Operations — STAGING'
          d['short_name']='S&W STAGING'
          p.write_text(json.dumps(d, indent=2)+"\n", encoding='utf-8')
          PY
          fi

          if [ -f staging-build/service-worker.js ]; then
            python3 - <<'PY'
          from pathlib import Path
          p=Path('staging-build/service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('operations-v4', 'operations-staging-v4')
          s=s.replace('height-safety-register', 'height-safety-register-staging')
          p.write_text(s, encoding='utf-8')
          PY
          fi

          if grep -R -F "$PRODUCTION_PROJECT_REF" staging-build/config.js >/dev/null; then
            echo "SAFETY STOP: generated staging config references production." >&2
            exit 1
          fi
          grep -F "$STAGING_URL" staging-build/config.js >/dev/null
          grep -F 'STAGING — TEST DATA ONLY — NOT PRODUCTION' staging-build/index.html >/dev/null
          grep -F 'Pacific/Auckland' staging-build/app.js >/dev/null
          grep -F 'Pacific/Auckland' staging-build/operations-v4.js >/dev/null

          cat > staging-build/STAGING-README.txt <<EOF
          Spray & Wash Operations — STAGING TEST BUILD

          Environment: STAGING
          Supabase project name: $STAGING_PROJECT_NAME
          Supabase project ref: $STAGING_PROJECT_REF
          Supabase project URL: $STAGING_URL
          Source commit: $GITHUB_SHA
          Built UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Calendar timezone: Pacific/Auckland (NZST/NZDT automatically)

          This build is for functional testing only.
          It does not point to the production Supabase project.
          All data entered through this build is staging/test data.
          Database timestamps remain UTC; date-only logic and displayed/generated local times use Pacific/Auckland.
          EOF
          find staging-build -type f -print0 | sort -z | xargs -0 sha256sum > staging-build/SHA256SUMS.txt

      - name: Upload staging app bundle
        uses: actions/upload-artifact@v4
        with:
          name: spray-wash-staging-app
          path: staging-build/
          retention-days: 30
          if-no-files-found: error

      - name: Write run summary
        shell: bash
        env:
          STAGING_PROJECT_REF: ${{ steps.staging.outputs.project_ref }}
        run: |
          {
            echo '## Spray & Wash staging app built'
            echo
            echo '- Production config was not changed.'
            echo "- Staging Supabase project: \`${STAGING_PROJECT_REF}\`"
            echo '- The staging project was discovered by name, not hard-coded.'
            echo '- The staging publishable key was retrieved at build time and masked in logs.'
            echo '- The app has a permanent STAGING — TEST DATA ONLY banner.'
            echo '- Staging date-only logic uses `Pacific/Auckland`, including NZST/NZDT daylight-saving changes.'
            echo '- Database timestamps remain UTC.'
            echo '- Download artifact: `spray-wash-staging-app`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary key material
        if: always()
        shell: bash
        run: rm -f projects.json staging-api-keys.json staging-publishable-key.txt

name: Build staging app

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD STAGING APP to confirm
        required: true

permissions:
  contents: read

concurrency:
  group: build-staging-app
  cancel-in-progress: false

jobs:
  build:
    name: Build staging-only app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_PROJECT_REF: tsmbvezrweciaitkquf
      STAGING_URL: https://tsmbvezrweciaitkquf.supabase.co
      PRODUCTION_PROJECT_REF: twkgfmctuffmkvkmdkct

    steps:
      - name: Validate confirmation and token
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "BUILD STAGING APP" ]; then
            echo "Confirmation did not match BUILD STAGING APP." >&2
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing repository secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          if [ "$STAGING_PROJECT_REF" = "$PRODUCTION_PROJECT_REF" ]; then
            echo "SAFETY STOP: staging project ref matches production." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve staging publishable key
        shell: bash
        run: |
          set -euo pipefail
          supabase projects api-keys --project-ref "$STAGING_PROJECT_REF" --output json > staging-api-keys.json
          publishable="$(jq -r '[.[]? | select((.type // .name // "") == "publishable" or (.api_key // .key // "") | startswith("sb_publishable_")) | (.api_key // .key)] | map(select(. != null and . != "")) | first // empty' staging-api-keys.json)"
          if [ -z "$publishable" ]; then
            publishable="$(jq -r '[.[]? | (.api_key // .key // empty) | select(startswith("sb_publishable_"))] | first // empty' staging-api-keys.json)"
          fi
          if [ -z "$publishable" ]; then
            echo "No staging publishable key was returned. Create a publishable key in Supabase Settings > API Keys, then rerun." >&2
            exit 1
          fi
          echo "::add-mask::$publishable"
          printf '%s' "$publishable" > staging-publishable-key.txt

      - name: Create isolated staging bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging-build
          mkdir staging-build
          rsync -a ./ staging-build/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'supabase/' \
            --exclude 'staging-build/' \
            --exclude '*.zip'

          publishable="$(cat staging-publishable-key.txt)"
          cat > staging-build/config.js <<EOF
          // STAGING ONLY. Generated by GitHub Actions. Do not use for production.
          window.SUPABASE_URL = "$STAGING_URL";
          window.SUPABASE_ANON_KEY = "$publishable";
          window.SPRAY_WASH_ENV = "staging";
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('staging-build/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<body>'
          banner = '''<body class="stagingEnvironment">
          <div id="stagingEnvironmentBanner" style="position:sticky;top:0;z-index:99999;background:#b91c1c;color:#fff;text-align:center;padding:9px 12px;font:900 14px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.04em;box-shadow:0 2px 10px #0003">STAGING — TEST DATA ONLY — NOT PRODUCTION</div>'''
          if marker not in s:
              raise SystemExit('Could not locate <body> in index.html')
          s = s.replace(marker, banner, 1)
          s = s.replace('<title>Spray &amp; Wash Operations</title>', '<title>STAGING — Spray &amp; Wash Operations</title>', 1)
          p.write_text(s, encoding='utf-8')
          PY

          if [ -f staging-build/manifest.webmanifest ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('staging-build/manifest.webmanifest')
          try:
              d=json.loads(p.read_text(encoding='utf-8'))
              d['name']='Spray & Wash Operations — STAGING'
              d['short_name']='S&W STAGING'
              p.write_text(json.dumps(d, indent=2)+"\n", encoding='utf-8')
          except Exception as e:
              raise SystemExit(f'Could not update manifest: {e}')
          PY
          fi

          # Use a staging-specific service-worker cache namespace so it cannot share the production cache.
          if [ -f staging-build/service-worker.js ]; then
            sed -i 's/operations-v4[^"'"']*/operations-staging-v4/g' staging-build/service-worker.js || true
            sed -i 's/height-safety-register[^"'"']*/height-safety-register-staging/g' staging-build/service-worker.js || true
          fi

          if grep -R -F "$PRODUCTION_PROJECT_REF" staging-build/config.js >/dev/null; then
            echo "SAFETY STOP: generated staging config references production." >&2
            exit 1
          fi
          grep -F "$STAGING_URL" staging-build/config.js >/dev/null
          grep -F 'STAGING — TEST DATA ONLY — NOT PRODUCTION' staging-build/index.html >/dev/null

      - name: Write staging build information
        shell: bash
        run: |
          set -euo pipefail
          cat > staging-build/STAGING-README.txt <<EOF
          Spray & Wash Operations — STAGING TEST BUILD

          Environment: STAGING
          Supabase project ref: $STAGING_PROJECT_REF
          Supabase project URL: $STAGING_URL
          Source commit: $GITHUB_SHA
          Built UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          This build is for functional testing only.
          It does not point to the production Supabase project.
          All data entered through this build is staging/test data.
          EOF
          find staging-build -type f -print0 | sort -z | xargs -0 sha256sum > staging-build/SHA256SUMS.txt

      - name: Upload staging app bundle
        uses: actions/upload-artifact@v4
        with:
          name: spray-wash-staging-app
          path: staging-build/
          retention-days: 30
          if-no-files-found: error

      - name: Write run summary
        shell: bash
        run: |
          {
            echo '## Spray & Wash staging app built'
            echo
            echo '- Production config was not changed.'
            echo "- Staging Supabase project: \`${STAGING_PROJECT_REF}\`"
            echo '- The staging publishable key was retrieved at build time and masked in logs.'
            echo '- The app has a permanent STAGING — TEST DATA ONLY banner.'
            echo '- A staging-specific service-worker cache namespace was prepared.'
            echo '- Download artifact: `spray-wash-staging-app`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary key material
        if: always()
        shell: bash
        run: rm -f staging-api-keys.json staging-publishable-key.txt

name: Controlled staging pilot push fallback

on:
  push:
    branches:
      - codex/staging-pilot-push-fallback-20260905

permissions:
  contents: read

jobs:
  send-one:
    name: Send exactly one staging pilot push and disable controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_PROJECT_REF: tsnmbvezrweciaitkquf
      PRODUCTION_PROJECT_REF: twkgfmctuffmkvkmdkct
      NOTIFICATION_ID: 4cc001de-8963-4f7d-8ec5-6fd048aef989
    steps:
      - name: Validate isolated scope
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/staging-pilot-push-fallback-20260905"
          test "$STAGING_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy reviewed function and enable one controlled delivery
        id: controls
        run: |
          set -euo pipefail
          supabase functions deploy employee-notifications --no-verify-jwt --project-ref "$STAGING_PROJECT_REF"
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          printf 'TASK_PUSH_SCHEDULER_SECRET=%s\nTASK_PUSH_DELIVERY_ENABLED=true\nSTAGING_ROUTINE_PUSH_TEST_DELIVERY_ENABLED=true\n' "$secret" > .pilot-push-secrets
          supabase secrets set --project-ref "$STAGING_PROJECT_REF" --env-file .pilot-push-secrets
          rm .pilot-push-secrets
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
      - name: Send the designated pilot notification
        env:
          TASK_PUSH_SECRET: ${{ steps.controls.outputs.secret }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H 'content-type: application/json' \
            -H "x-spray-wash-task-push-secret: $TASK_PUSH_SECRET" \
            --data "{\"action\":\"run_task_push_delivery\",\"controlled_test\":\"SEND_ONE_STAGING_ROUTINE_PUSH\",\"notification_id\":\"$NOTIFICATION_ID\"}" \
            "https://$STAGING_PROJECT_REF.supabase.co/functions/v1/employee-notifications")"
          echo "$response" | jq -e '.ok == true and .controlled == true and .notifications_considered == 1 and .sent == 1 and .failed == 0' >/dev/null
      - name: Verify one recorded delivery
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            sql="select n.state, (select count(*) from operations_notification_deliveries d where d.notification_id=n.id and d.channel='push' and d.status='sent') as sent from operations_notifications n where n.id='$NOTIFICATION_ID';"
            response="$(curl --silent --show-error --fail --request POST "https://api.supabase.com/v1/projects/$STAGING_PROJECT_REF/database/query" --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header "Content-Type: application/json" --data "$(jq -n --arg query "$sql" '{query:$query}')")"
            if echo "$response" | jq -e '.. | objects | select(.state == "sent" and .sent == 1)' >/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Disable all delivery controls
        if: always()
        run: |
          printf 'TASK_PUSH_DELIVERY_ENABLED=false\nSTAGING_ROUTINE_PUSH_TEST_DELIVERY_ENABLED=false\n' > .pilot-push-disable
          supabase secrets set --project-ref "$STAGING_PROJECT_REF" --env-file .pilot-push-disable
          rm -f .pilot-push-disable

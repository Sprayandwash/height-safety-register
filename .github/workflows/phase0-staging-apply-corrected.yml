name: Apply corrected Phase 0 repair to staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY CORRECTED PHASE 0 TO STAGING to confirm
        required: true

permissions:
  contents: read

concurrency:
  group: phase0-staging-apply-corrected
  cancel-in-progress: false

jobs:
  apply:
    name: Apply corrected Phase 0 on staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      PRODUCTION_PROJECT_REF: twkgfmctuffmkvkmdkct
      PACKAGE_PATH: supabase/phase0/sql/P0-Repair.zip
      PACKAGE_SHA256: 910aa6879108dc37e397045408a9faf5e3e3bef3cb8c66e7fbb58c90f96311de
      PGCONNECT_TIMEOUT: 12

    steps:
      - name: Validate confirmation and staging target
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "APPLY CORRECTED PHASE 0 TO STAGING" ]; then
            echo "Confirmation did not match APPLY CORRECTED PHASE 0 TO STAGING." >&2
            exit 1
          fi
          if [ -z "${SUPABASE_STAGING_DB_URL:-}" ]; then
            echo "Missing repository secret: SUPABASE_STAGING_DB_URL" >&2
            exit 1
          fi
          case "$SUPABASE_STAGING_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "SUPABASE_STAGING_DB_URL is not a PostgreSQL connection string." >&2; exit 1 ;;
          esac
          if printf '%s' "$SUPABASE_STAGING_DB_URL" | grep -q "$PRODUCTION_PROJECT_REF"; then
            echo "SAFETY STOP: the target URL contains the production project reference." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client unzip

      - name: Verify exact reviewed repair package
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PACKAGE_PATH"
          actual="$(sha256sum "$PACKAGE_PATH" | awk '{print $1}')"
          if [ "$actual" != "$PACKAGE_SHA256" ]; then
            echo "Repair package checksum mismatch." >&2
            echo "Expected: $PACKAGE_SHA256" >&2
            echo "Actual:   $actual" >&2
            exit 1
          fi
          rm -rf phase0-work
          mkdir -p phase0-work
          unzip -q "$PACKAGE_PATH" -d phase0-work
          (
            cd phase0-work/P0
            sha256sum -c SHA256.txt
          )

      - name: Prepare hosted Supabase compatibility copy
        shell: bash
        run: |
          set -euo pipefail
          source_file="phase0-work/P0/sql/01-fix.sql"
          corrected_file="phase0-work/P0/sql/01-fix-hosted-supabase.sql"
          cp "$source_file" "$corrected_file"
          statement='ALTER TABLE "storage"."objects" ENABLE ROW LEVEL SECURITY;'
          count="$(grep -Fxc "$statement" "$corrected_file" || true)"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one managed Storage ALTER statement, found $count." >&2
            exit 1
          fi
          sed -i '\|^ALTER TABLE "storage"\."objects" ENABLE ROW LEVEL SECURITY;$|d' "$corrected_file"
          if grep -Fq "$statement" "$corrected_file"; then
            echo "Managed Storage ALTER statement was not removed." >&2
            exit 1
          fi
          sha256sum "$corrected_file" | tee phase0-corrected-sql-sha256.txt
          cat > phase0-hosted-correction.txt <<'NOTE'
          Hosted Supabase compatibility correction:
          Removed only the redundant statement:
          ALTER TABLE "storage"."objects" ENABLE ROW LEVEL SECURITY;
          Supabase owns the managed storage.objects table. The workflow separately verifies that RLS is already enabled before applying the remaining reviewed SQL.
          NOTE

      - name: Confirm staging database identity and RLS
        shell: bash
        run: |
          set -euo pipefail
          connected=0
          for attempt in $(seq 1 10); do
            if psql \
              --variable ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --dbname "$SUPABASE_STAGING_DB_URL" \
              --command "select current_database() || '|' || current_user || '|' || current_setting('server_version');" \
              > phase0-staging-identity.txt; then
              connected=1
              break
            fi
            echo "Staging connection attempt $attempt/10 failed; waiting 15 seconds."
            sleep 15
          done
          if [ "$connected" -ne 1 ]; then
            echo "Could not connect to staging after 10 attempts." >&2
            exit 1
          fi
          cat phase0-staging-identity.txt
          rls="$(psql --variable ON_ERROR_STOP=1 --tuples-only --no-align --dbname "$SUPABASE_STAGING_DB_URL" --command "select c.relrowsecurity from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='storage' and c.relname='objects';")"
          if [ "$rls" != "t" ]; then
            echo "SAFETY STOP: storage.objects does not already have RLS enabled." >&2
            exit 1
          fi
          echo "storage_objects_rls_enabled=true" | tee phase0-storage-rls.txt

      - name: Restore storage-policy baseline omitted by logical dump
        shell: bash
        run: |
          set -euo pipefail
          psql --variable ON_ERROR_STOP=1 --dbname "$SUPABASE_STAGING_DB_URL" <<'SQL' | tee phase0-storage-baseline.txt
          DO $$
          DECLARE
            v_count integer;
            v_missing integer;
          BEGIN
            SELECT count(*) INTO v_count FROM pg_policies WHERE schemaname='storage' AND tablename='objects';
            IF v_count = 0 THEN
              CREATE POLICY "storage equipment photos v34 delete" ON storage.objects AS PERMISSIVE FOR DELETE TO authenticated USING ((bucket_id='equipment-photos' AND public.has_any_app_role(ARRAY['Admin','Inspector','Equipment Manager'])));
              CREATE POLICY "storage equipment photos v34 insert" ON storage.objects AS PERMISSIVE FOR INSERT TO authenticated WITH CHECK ((bucket_id='equipment-photos' AND public.has_any_app_role(ARRAY['Admin','Inspector','Equipment Manager'])));
              CREATE POLICY "storage equipment photos v34 select" ON storage.objects AS PERMISSIVE FOR SELECT TO authenticated USING ((bucket_id='equipment-photos' AND public.has_any_app_role(ARRAY['Admin','Inspector','Equipment Manager','Certificate Approver','Office / Reports','Viewer'])));
              CREATE POLICY "storage equipment photos v34 update" ON storage.objects AS PERMISSIVE FOR UPDATE TO authenticated USING ((bucket_id='equipment-photos' AND public.has_any_app_role(ARRAY['Admin','Inspector','Equipment Manager']))) WITH CHECK ((bucket_id='equipment-photos' AND public.has_any_app_role(ARRAY['Admin','Inspector','Equipment Manager'])));
              CREATE POLICY "storage inspection photos v34 delete" ON storage.objects AS PERMISSIVE FOR DELETE TO authenticated USING ((bucket_id='inspection-photos' AND public.has_any_app_role(ARRAY['Admin','Inspector'])));
              CREATE POLICY "storage inspection photos v34 insert" ON storage.objects AS PERMISSIVE FOR INSERT TO authenticated WITH CHECK ((bucket_id='inspection-photos' AND public.has_any_app_role(ARRAY['Admin','Inspector'])));
              CREATE POLICY "storage inspection photos v34 select" ON storage.objects AS PERMISSIVE FOR SELECT TO authenticated USING ((bucket_id='inspection-photos' AND public.has_any_app_role(ARRAY['Admin','Inspector','Equipment Manager','Certificate Approver','Office / Reports','Viewer'])));
              CREATE POLICY "storage inspection photos v34 update" ON storage.objects AS PERMISSIVE FOR UPDATE TO authenticated USING ((bucket_id='inspection-photos' AND public.has_any_app_role(ARRAY['Admin','Inspector']))) WITH CHECK ((bucket_id='inspection-photos' AND public.has_any_app_role(ARRAY['Admin','Inspector'])));
            ELSIF v_count <> 8 THEN
              RAISE EXCEPTION 'Unexpected staging storage.objects policy count: %', v_count;
            END IF;
            SELECT count(*) INTO v_missing
            FROM (VALUES
              ('storage equipment photos v34 delete'),('storage equipment photos v34 insert'),('storage equipment photos v34 select'),('storage equipment photos v34 update'),
              ('storage inspection photos v34 delete'),('storage inspection photos v34 insert'),('storage inspection photos v34 select'),('storage inspection photos v34 update')
            ) expected(policyname)
            LEFT JOIN pg_policies p ON p.schemaname='storage' AND p.tablename='objects' AND p.policyname=expected.policyname
            WHERE p.policyname IS NULL;
            IF v_missing <> 0 THEN RAISE EXCEPTION 'Staging storage-policy baseline incomplete: % missing', v_missing; END IF;
          END $$;
          select 'storage_object_policies=' || count(*) from pg_policies where schemaname='storage' and tablename='objects';
          SQL

      - name: Run reviewed package preflight
        shell: bash
        run: |
          set -euo pipefail
          psql --variable ON_ERROR_STOP=1 --dbname "$SUPABASE_STAGING_DB_URL" --file phase0-work/P0/sql/00-check.sql | tee phase0-package-preflight.txt

      - name: Capture before-state evidence
        shell: bash
        run: |
          set -euo pipefail
          psql --variable ON_ERROR_STOP=1 --tuples-only --no-align --dbname "$SUPABASE_STAGING_DB_URL" <<'SQL' | tee phase0-before-state.txt
          select 'public_policies=' || count(*) from pg_policies where schemaname='public';
          select 'storage_object_policies=' || count(*) from pg_policies where schemaname='storage' and tablename='objects';
          select 'legacy_policy_mentions=' || count(*) from pg_policies where schemaname in ('public','storage') and concat_ws(' ',qual,with_check) ~ '(Inspector|Equipment Manager|Certificate Approver|Office / Reports|Viewer)';
          select 'open_height_tasks=' || count(*) from public.operations_maintenance_tasks where source_module='height_equipment' and status not in ('Completed','Deferred');
          SQL

      - name: Apply corrected reviewed Phase 0 repair
        shell: bash
        run: |
          set -euo pipefail
          psql \
            --variable ON_ERROR_STOP=1 \
            --dbname "$SUPABASE_STAGING_DB_URL" \
            --file phase0-work/P0/sql/01-fix-hosted-supabase.sql \
            | tee phase0-apply-output.txt

      - name: Run reviewed verification report
        shell: bash
        run: |
          set -euo pipefail
          psql --variable ON_ERROR_STOP=1 --dbname "$SUPABASE_STAGING_DB_URL" --file phase0-work/P0/sql/02-verify.sql | tee phase0-verification-report.txt

      - name: Enforce required Phase 0 outcomes
        shell: bash
        run: |
          set -euo pipefail
          psql --variable ON_ERROR_STOP=1 --dbname "$SUPABASE_STAGING_DB_URL" <<'SQL' | tee phase0-enforced-results.txt
          DO $$
          DECLARE v_missing integer; v_legacy integer; v_rls boolean;
          BEGIN
            SELECT count(*) INTO v_missing
            FROM (VALUES
              ('phase0 app_settings delete admin'),('phase0 app_settings insert admin'),('phase0 app_settings select app roles'),('phase0 app_settings update admin'),
              ('phase0 user_roles delete admin'),('phase0 user_roles insert admin'),('phase0 user_roles select self or admin'),('phase0 user_roles update admin'),
              ('phase0 objects select equipment photos'),('phase0 objects select inspection photos')
            ) expected(policyname)
            LEFT JOIN pg_policies p ON p.policyname=expected.policyname
            WHERE p.policyname IS NULL;
            SELECT count(*) INTO v_legacy FROM pg_policies WHERE schemaname IN ('public','storage') AND concat_ws(' ',qual,with_check) ~ '(Inspector|Equipment Manager|Certificate Approver|Office / Reports|Viewer)';
            SELECT c.relrowsecurity INTO v_rls FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='storage' AND c.relname='objects';
            IF v_missing <> 0 THEN RAISE EXCEPTION 'Required Phase 0 policies missing: %', v_missing; END IF;
            IF v_legacy <> 0 THEN RAISE EXCEPTION 'Legacy role mentions remain in policies: %', v_legacy; END IF;
            IF v_rls IS DISTINCT FROM true THEN RAISE EXCEPTION 'storage.objects RLS is not enabled'; END IF;
            IF NOT has_function_privilege('authenticated','public.operations_sync_automatic_tasks_v4077()','EXECUTE') THEN RAISE EXCEPTION 'authenticated cannot execute task sync'; END IF;
            IF has_function_privilege('anon','public.operations_sync_automatic_tasks_v4077()','EXECUTE') THEN RAISE EXCEPTION 'anon can execute task sync'; END IF;
            IF has_function_privilege('authenticated','public.operations_height_failure_task_v4077()','EXECUTE') THEN RAISE EXCEPTION 'authenticated can call trigger function directly'; END IF;
          END $$;
          select 'public_policies=' || count(*) from pg_policies where schemaname='public';
          select 'storage_object_policies=' || count(*) from pg_policies where schemaname='storage' and tablename='objects';
          select 'legacy_policy_mentions=' || count(*) from pg_policies where schemaname in ('public','storage') and concat_ws(' ',qual,with_check) ~ '(Inspector|Equipment Manager|Certificate Approver|Office / Reports|Viewer)';
          select 'storage_objects_rls=' || c.relrowsecurity from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='storage' and c.relname='objects';
          select 'authenticated_can_sync=' || has_function_privilege('authenticated','public.operations_sync_automatic_tasks_v4077()','EXECUTE');
          select 'anon_can_sync=' || has_function_privilege('anon','public.operations_sync_automatic_tasks_v4077()','EXECUTE');
          select 'authenticated_can_call_trigger=' || has_function_privilege('authenticated','public.operations_height_failure_task_v4077()','EXECUTE');
          SQL

      - name: Upload Phase 0 staging evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase0-staging-corrected-apply-evidence
          path: |
            phase0-staging-identity.txt
            phase0-storage-rls.txt
            phase0-storage-baseline.txt
            phase0-package-preflight.txt
            phase0-before-state.txt
            phase0-hosted-correction.txt
            phase0-corrected-sql-sha256.txt
            phase0-apply-output.txt
            phase0-verification-report.txt
            phase0-enforced-results.txt
            phase0-work/P0/SHA256.txt
            phase0-work/P0/RUN.md
            phase0-work/P0/TESTS.md
          retention-days: 30
          if-no-files-found: error

      - name: Write run summary
        shell: bash
        run: |
          {
            echo '## Corrected Phase 0 staging repair completed'
            echo
            echo '- The production project reference safety check passed.'
            echo '- The original package and every packaged file passed SHA-256 verification.'
            echo '- storage.objects RLS was confirmed as already enabled.'
            echo '- Only the redundant managed-table ALTER statement was removed from the extracted execution copy.'
            echo '- The remaining reviewed repair completed and all enforced checks passed.'
            echo
            echo '### Enforced results'
            echo '```text'
            cat phase0-enforced-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove extracted package
        if: always()
        shell: bash
        run: rm -rf phase0-work

name: Build staging Maintenance report

on:
  push:
    paths:
      - '.github/workflows/build-staging-maintenance-report.yml'
      - 'tools/patch-staging-maintenance-report.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KNOWN_GOOD_HEAD_SHA: 02aa4fa66e80f95779f103c63a23e9500080ff56
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download exact known-good staging app
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts?name=spray-wash-staging-app-home-fixed&per_page=100" > artifacts.json
          artifact_id="$(jq -r --arg sha "$KNOWN_GOOD_HEAD_SHA" '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0].id // empty' artifacts.json)"
          test -n "$artifact_id" || { echo 'Known-good staging artifact not found.' >&2; exit 1; }
          echo "Using known-good artifact id: $artifact_id"
          gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > known-good.zip
          rm -rf staging-build
          mkdir staging-build
          unzip -q known-good.zip -d staging-build
          test -f staging-build/app.js
          test -f staging-build/operations-v4.js
          test -f staging-build/index.html
          test -f staging-build/config.js
          test -f staging-build/service-worker.js
          grep -F 'window.SPRAY_WASH_ENV = "staging"' staging-build/config.js
          grep -F 'window.SW_STAGING_HOME_BUILD = "home-name-fix-v5-20260813";' staging-build/app.js

      - name: Protect known-good non-report files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum staging-build/app.js staging-build/index.html staging-build/config.js staging-build/service-worker.js > protected.sha256
          cp staging-build/operations-v4.js operations-v4.before.js

      - name: Apply Maintenance report feature
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch-staging-maintenance-report.py staging-build/operations-v4.js
          node --check staging-build/operations-v4.js
          grep -F 'id="opsMaintenanceReportPrint"' staging-build/operations-v4.js
          grep -F 'id="opsMaintenanceReportCsv"' staging-build/operations-v4.js
          grep -F 'function printMaintenanceReport(){' staging-build/operations-v4.js
          grep -F 'function downloadMaintenanceReportCsv(){' staging-build/operations-v4.js
          if cmp -s operations-v4.before.js staging-build/operations-v4.js; then
            echo 'Maintenance report patch made no change.' >&2
            exit 1
          fi

      - name: Verify known-good app shell is untouched
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c protected.sha256
          node --check staging-build/app.js
          echo 'app.js, index.html, config.js and service-worker.js remain byte-for-byte identical to the known-good staging build.'

      - name: Write build evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Staging Maintenance report feature.' \
            'Adds per-asset Print / Save PDF and Download CSV controls to Maintenance Log filters.' \
            'Uses the selected vehicle or machinery plus current Maintenance Log filters.' \
            'Only operations-v4.js differs from the known-good app bundle.' \
            > staging-build/MAINTENANCE_REPORT_BUILD.txt
          find staging-build -type f -print0 | sort -z | xargs -0 sha256sum > staging-build/SHA256SUMS.txt

      - name: Upload staging report artifact
        uses: actions/upload-artifact@v4
        with:
          name: spray-wash-staging-app-maintenance-report
          path: staging-build/
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Staging Maintenance report build'
            echo
            echo '- Production was not changed.'
            echo '- Starts from the exact known-good Home/Vehicle Checks staging artifact.'
            echo '- Only `operations-v4.js` is modified.'
            echo '- Adds `Print / Save PDF` and `Download CSV` to Maintenance Log filters.'
            echo '- Report generation requires a selected vehicle or machinery item.'
            echo '- Current type/date/keyword filters are respected.'
            echo '- Artifact: `spray-wash-staging-app-maintenance-report`.'
          } >> "$GITHUB_STEP_SUMMARY"
